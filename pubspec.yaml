name: texafrost
description: "A production-grade offline-first field technician mobile application."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # --- State Management ---
  provider: ^6.1.2

  # --- Networking & REST API ---
  dio: ^5.7.0

  # --- Offline Database & Local Storage ---
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.2  # Auth token & sensitive credentials
  shared_preferences: ^2.3.3      # App state & user preferences

  # --- Network Connectivity ---
  connectivity_plus: ^6.1.0       # Auto-detect internet for background sync

  # --- Device & Hardware Integration ---
  local_auth: ^2.3.0              # Biometric & PIN authentication
  image_picker: ^1.1.2            # Job completion proof & camera capture

  # --- UI & Styling ---
  flutter_screenutil: ^5.9.3   
  flutter_svg: ^2.0.10+1          # Vector icon rendering
  google_fonts: ^6.2.1            # Typography support
  intl: ^0.19.0                   # Date, time & schedule formatting
  shimmer: ^3.0.0                 # Skeleton loading effects
  fluttertoast: ^8.2.8
            # Action feedback & offline alerts

  # --- Utilities ---
  uuid: ^4.5.1                    # Offline queue entity ID generation

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # --- Code Generation for Hive Adapters ---
  build_runner: ^2.4.13
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/